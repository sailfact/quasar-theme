# Quasar theme source. Generated JSON lives in themes/ and is gitignored.
# Edit this file, then run `npm run build`.
#
# Values written as $ROLE resolve from the `palettes` block below. Every colour
# below the `variants:` line is a $ROLE — hex appears only in the palettes.
# `!alpha [$ROLE, '1f']` appends a constant alpha suffix. `~` omits the key.

$schema: vscode://schemas/color-theme
type: dark
semanticHighlighting: true

palettes:
  dark:
    # --- neutrals fixed across variants (design-system ramps) ---
    FG_SECONDARY:         '#a5b1cc'            # slate-300 / --text-secondary
    FG_MUTED:             '#8090b0'            # slate-400 / --text-muted
    FG_FAINT:             '#6a789c'            # slate-500 / --text-faint
    FG_SUBTLE:            '#c6cee0'            # slate-200 / --ansi-white
    FG_PAPER:             '#e8e8f0'            # paper-100 / --term-fg
    FG_BRIGHT:            '#f0f0f8'            # paper-50 / --text-primary
    FG_MAX:               '#f8f8f8'            # paper-0 / --ansi-bright-white
    FG_ON_ACCENT:         '#14141c'            # ink-900 / --text-on-accent
    SURFACE_APP:          '#14141c'            # ink-900, fixed terminal sticky scroll
    SURFACE_CARD:         '#1e2436'            # navy-800, fixed terminal sticky hover
    SURFACE_SUNKEN:       '#0e0e14'            # ink-950, inputs + terminal + ansi black
    BORDER_DEFAULT:       '#303850'            # navy-500, scrollbar slider rest
    BORDER_STRONG:        '#3a4460'            # navy-400 / --ansi-bright-black
    SLIDER_ACTIVE:        '#4a5470'            # scrollbar slider pressed
    SHADOW:               '#08080e'            # widget + scrollbar shadow
    # --- per-variant surface ramp ---
    SURFACE_CHROME:       '#0e0e14'            # title bar, activity bar, panel, status bar
    SURFACE_PANEL:        '#1a1a24'            # side bar, widgets, menus, notifications
    SURFACE_RAISED:       '#232b40'            # inlay hints, secondary buttons, banners
    SURFACE_HOVER:        '#283048'            # list/tab hover, badges
    SURFACE_EDITOR:       '#14141c'            # editor canvas
    SURFACE_TAB_ACTIVE:   '#1e2436'            # active tab
    BORDER:               '#242c40'            # --border-subtle at each depth
    # --- per-variant text ramp ---
    FG_EDITOR:            '#e8e8f0'            # editor foreground
    MUTED:                '#6a789c'            # descriptions, inactive chrome text
    FAINT:                '#3a4460'            # line numbers, ghost text, disabled
    # --- accents (fixed) ---
    ACCENT:               '#f080a0'            # rose-500
    ACCENT_BRIGHT:        '#f4a0b8'            # rose-400
    ACCENT_LIGHT:         '#f8c0d0'            # rose-300
    ACCENT_DEEP:          '#b8506e'            # rose-700
    ACCENT_YELLOW:        '#e0b478'            # amber-400
    WARNING:              '#d4a259'            # amber-500
    ACCENT_GREEN:         '#8fc7b0'            # mint-400
    GIT_ADDED:            '#74b39a'            # mint-500
    ACCENT_BLUE:          '#84acdc'            # blue-400
    GIT_MODIFIED:         '#6090c8'            # blue-500
    ACCENT_CYAN:          '#8cc5cc'            # --ansi-bright-cyan
    ANSI_CYAN:            '#6aa8b0'
    ANSI_MAGENTA:         '#a86d7e'            # plum-400
    ACCENT_TYPE:          '#c98ba0'            # --ansi-bright-magenta
    # --- per-variant accent + syntax ---
    ACCENT_ACTIVE:        '#f080a0'            # cursor + keyword rose
    SYN_STRING:           '#8fc7b0'
    SYN_FUNCTION:         '#84acdc'
    SYN_TYPE:             '#c98ba0'
    SYN_VARIABLE:         '#c6cee0'
    SYN_OPERATOR:         '#8090b0'
    SYN_COMMENT:          '#6a789c'
    # --- validation backdrops (fixed) ---
    BG_ERROR:             '#2a1520'
    BG_WARNING:           '#2a2216'
    BG_INFO:              '#151f2a'
    # --- overlays ---
    OVERLAY_LIGHT:        '#ffffff'
    OVERLAY_DARK:         '#000000'
    # --- literal 8-digit roles (alpha itself varies per variant) ---
    TRANSPARENT:          '#00000000'
    SELECTION:            '#f080a038'
    SELECTION_SUBTLE:     '#f080a01f'

  ink:
    # --- neutrals fixed across variants (design-system ramps) ---
    FG_SECONDARY:         '#a5b1cc'            # slate-300 / --text-secondary
    FG_MUTED:             '#8090b0'            # slate-400 / --text-muted
    FG_FAINT:             '#6a789c'            # slate-500 / --text-faint
    FG_SUBTLE:            '#c6cee0'            # slate-200 / --ansi-white
    FG_PAPER:             '#e8e8f0'            # paper-100 / --term-fg
    FG_BRIGHT:            '#f0f0f8'            # paper-50 / --text-primary
    FG_MAX:               '#f8f8f8'            # paper-0 / --ansi-bright-white
    FG_ON_ACCENT:         '#14141c'            # ink-900 / --text-on-accent
    SURFACE_APP:          '#14141c'            # ink-900, fixed terminal sticky scroll
    SURFACE_CARD:         '#1e2436'            # navy-800, fixed terminal sticky hover
    SURFACE_SUNKEN:       '#0e0e14'            # ink-950, inputs + terminal + ansi black
    BORDER_DEFAULT:       '#303850'            # navy-500, scrollbar slider rest
    BORDER_STRONG:        '#3a4460'            # navy-400 / --ansi-bright-black
    SLIDER_ACTIVE:        '#4a5470'            # scrollbar slider pressed
    SHADOW:               '#08080e'            # widget + scrollbar shadow
    # --- per-variant surface ramp ---
    SURFACE_CHROME:       '#0a0a10'            # title bar, activity bar, panel, status bar
    SURFACE_PANEL:        '#0e0e14'            # side bar, widgets, menus, notifications
    SURFACE_RAISED:       '#1a1a24'            # inlay hints, secondary buttons, banners
    SURFACE_HOVER:        '#232b40'            # list/tab hover, badges
    SURFACE_EDITOR:       '#0a0a10'            # editor canvas
    SURFACE_TAB_ACTIVE:   '#1a1a24'            # active tab
    BORDER:               '#1e2436'            # --border-subtle at each depth
    # --- per-variant text ramp ---
    FG_EDITOR:            '#f8f8f8'            # editor foreground
    MUTED:                '#6a789c'            # descriptions, inactive chrome text
    FAINT:                '#303850'            # line numbers, ghost text, disabled
    # --- accents (fixed) ---
    ACCENT:               '#f080a0'            # rose-500
    ACCENT_BRIGHT:        '#f4a0b8'            # rose-400
    ACCENT_LIGHT:         '#f8c0d0'            # rose-300
    ACCENT_DEEP:          '#b8506e'            # rose-700
    ACCENT_YELLOW:        '#e0b478'            # amber-400
    WARNING:              '#d4a259'            # amber-500
    ACCENT_GREEN:         '#8fc7b0'            # mint-400
    GIT_ADDED:            '#74b39a'            # mint-500
    ACCENT_BLUE:          '#84acdc'            # blue-400
    GIT_MODIFIED:         '#6090c8'            # blue-500
    ACCENT_CYAN:          '#8cc5cc'            # --ansi-bright-cyan
    ANSI_CYAN:            '#6aa8b0'
    ANSI_MAGENTA:         '#a86d7e'            # plum-400
    ACCENT_TYPE:          '#c98ba0'            # --ansi-bright-magenta
    # --- per-variant accent + syntax ---
    ACCENT_ACTIVE:        '#f4a0b8'            # cursor + keyword rose
    SYN_STRING:           '#8fc7b0'
    SYN_FUNCTION:         '#84acdc'
    SYN_TYPE:             '#8cc5cc'
    SYN_VARIABLE:         '#f0f0f8'
    SYN_OPERATOR:         '#a5b1cc'
    SYN_COMMENT:          '#3a4460'
    # --- validation backdrops (fixed) ---
    BG_ERROR:             '#2a1520'
    BG_WARNING:           '#2a2216'
    BG_INFO:              '#151f2a'
    # --- overlays ---
    OVERLAY_LIGHT:        '#ffffff'
    OVERLAY_DARK:         '#000000'
    # --- literal 8-digit roles (alpha itself varies per variant) ---
    TRANSPARENT:          '#00000000'
    SELECTION:            '#f080a042'
    SELECTION_SUBTLE:     '#f080a024'

  navy:
    # --- neutrals fixed across variants (design-system ramps) ---
    FG_SECONDARY:         '#a5b1cc'            # slate-300 / --text-secondary
    FG_MUTED:             '#8090b0'            # slate-400 / --text-muted
    FG_FAINT:             '#6a789c'            # slate-500 / --text-faint
    FG_SUBTLE:            '#c6cee0'            # slate-200 / --ansi-white
    FG_PAPER:             '#e8e8f0'            # paper-100 / --term-fg
    FG_BRIGHT:            '#f0f0f8'            # paper-50 / --text-primary
    FG_MAX:               '#f8f8f8'            # paper-0 / --ansi-bright-white
    FG_ON_ACCENT:         '#14141c'            # ink-900 / --text-on-accent
    SURFACE_APP:          '#14141c'            # ink-900, fixed terminal sticky scroll
    SURFACE_CARD:         '#1e2436'            # navy-800, fixed terminal sticky hover
    SURFACE_SUNKEN:       '#0e0e14'            # ink-950, inputs + terminal + ansi black
    BORDER_DEFAULT:       '#303850'            # navy-500, scrollbar slider rest
    BORDER_STRONG:        '#3a4460'            # navy-400 / --ansi-bright-black
    SLIDER_ACTIVE:        '#4a5470'            # scrollbar slider pressed
    SHADOW:               '#08080e'            # widget + scrollbar shadow
    # --- per-variant surface ramp ---
    SURFACE_CHROME:       '#1a1a24'            # title bar, activity bar, panel, status bar
    SURFACE_PANEL:        '#232b40'            # side bar, widgets, menus, notifications
    SURFACE_RAISED:       '#283048'            # inlay hints, secondary buttons, banners
    SURFACE_HOVER:        '#303850'            # list/tab hover, badges
    SURFACE_EDITOR:       '#1e2436'            # editor canvas
    SURFACE_TAB_ACTIVE:   '#283048'            # active tab
    BORDER:               '#303850'            # --border-subtle at each depth
    # --- per-variant text ramp ---
    FG_EDITOR:            '#e8e8f0'            # editor foreground
    MUTED:                '#8090b0'            # descriptions, inactive chrome text
