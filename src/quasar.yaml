variants:
  - id: dark
    label: "Quasar Dark"
    file: quasar-dark-color-theme.json
  - id: ink
    label: "Quasar Ink"
    file: quasar-ink-color-theme.json
  - id: navy
    label: "Quasar Navy"
    file: quasar-navy-color-theme.json

colors:
  # Base
  foreground:                                   $FG_SECONDARY
  errorForeground:                              $ACCENT
  descriptionForeground:                        $MUTED
  disabledForeground:                           $FAINT
  focusBorder:                                  $ACCENT
  widget.border:                                $BORDER
  widget.shadow:                                !alpha [$SHADOW, '99']
  selection.background:                         $SELECTION
  icon.foreground:                              $FG_SECONDARY
  sash.hoverBorder:                             $ACCENT
  toolbar.hoverBackground:                      $SURFACE_HOVER
  toolbar.activeBackground:                     $BORDER
  # Title bar and window
  titleBar.activeBackground:                    $SURFACE_CHROME
  titleBar.activeForeground:                    $FG_SECONDARY
  titleBar.inactiveBackground:                  $SURFACE_CHROME
  titleBar.inactiveForeground:                  $MUTED
  titleBar.border:                              $BORDER
  window.activeBorder:                          $BORDER
  window.inactiveBorder:                        $BORDER
  # Menu bar and menus
  menubar.selectionForeground:                  $FG_BRIGHT
  menubar.selectionBackground:                  $SURFACE_HOVER
  menubar.selectionBorder:                      $TRANSPARENT
  menu.background:                              $SURFACE_PANEL
  menu.foreground:                              $FG_SECONDARY
  menu.border:                                  $BORDER
  menu.selectionForeground:                     $FG_BRIGHT
  menu.selectionBackground:                     !alpha [$ACCENT, '29']
  menu.selectionBorder:                         $TRANSPARENT
  menu.separatorBackground:                     $BORDER
  # Quick input and command palette
  quickInput.background:                        $SURFACE_PANEL
  quickInput.foreground:                        $FG_SECONDARY
  quickInputTitle.background:                   $SURFACE_CHROME
  quickInputList.focusBackground:               !alpha [$ACCENT, '29']
  quickInputList.focusForeground:               $FG_BRIGHT
  quickInputList.focusIconForeground:           $ACCENT
  pickerGroup.foreground:                       $MUTED
  pickerGroup.border:                           $BORDER
  # Keybinding labels
  keybindingLabel.background:                   $SURFACE_RAISED
  keybindingLabel.foreground:                   $FG_SUBTLE
  keybindingLabel.border:                       $BORDER
  keybindingLabel.bottomBorder:                 $FAINT
  keybindingTable.headerBackground:             $SURFACE_RAISED
  keybindingTable.rowsBackground:               $SURFACE_PANEL
  # Command centre
  commandCenter.background:                     $SURFACE_RAISED
  commandCenter.foreground:                     $FG_SECONDARY
  commandCenter.border:                         $BORDER
  commandCenter.activeBackground:               $SURFACE_HOVER
  commandCenter.activeForeground:               $FG_BRIGHT
  commandCenter.activeBorder:                   $ACCENT
  commandCenter.inactiveForeground:             $MUTED
  commandCenter.inactiveBorder:                 $BORDER
  # Activity bar
  activityBar.background:                       $SURFACE_CHROME
  activityBar.foreground:                       $FG_BRIGHT
  activityBar.inactiveForeground:               $MUTED
  activityBar.border:                           $BORDER
  activityBar.activeBorder:                     $ACCENT
  activityBar.activeBackground:                 $TRANSPARENT
  activityBar.activeFocusBorder:                $ACCENT
  activityBarBadge.background:                  $ACCENT
  activityBarBadge.foreground:                  $FG_ON_ACCENT
  activityBarTop.foreground:                    $FG_BRIGHT
  activityBarTop.inactiveForeground:            $MUTED
  activityBarTop.activeBorder:                  $ACCENT
  # Side bar
  sideBar.background:                           $SURFACE_PANEL
  sideBar.foreground:                           $FG_SECONDARY
  sideBar.border:                               $BORDER
  sideBar.dropBackground:                       !alpha [$ACCENT, '1f']
  sideBarTitle.foreground:                      $MUTED
  sideBarTitle.background:                      $SURFACE_PANEL
  sideBarSectionHeader.background:              $SURFACE_PANEL
  sideBarSectionHeader.foreground:              $MUTED
  sideBarSectionHeader.border:                  $BORDER
  sideBarActivityBarTop.border:                 $BORDER
  # Lists and trees
  list.activeSelectionBackground:               !alpha [$ACCENT, '29']
  list.activeSelectionForeground:               $FG_BRIGHT
  list.activeSelectionIconForeground:           $ACCENT
  list.inactiveSelectionBackground:             $SURFACE_RAISED
  list.inactiveSelectionForeground:             $FG_SUBTLE
  list.hoverBackground:                         $SURFACE_HOVER
  list.hoverForeground:                         $FG_BRIGHT
  list.focusBackground:                         !alpha [$ACCENT, '1f']
  list.focusForeground:                         $FG_BRIGHT
  list.focusOutline:                            $ACCENT
  list.inactiveFocusBackground:                 $SURFACE_RAISED
  list.inactiveFocusOutline:                    $BORDER
  list.dropBackground:                          !alpha [$ACCENT, '1f']
  list.highlightForeground:                     $ACCENT
  list.focusHighlightForeground:                $ACCENT_BRIGHT
  list.errorForeground:                         $ACCENT
  list.warningForeground:                       $WARNING
  list.invalidItemForeground:                   $FAINT
  list.filterMatchBackground:                   !alpha [$ACCENT, '33']
  list.filterMatchBorder:                       $ACCENT_DEEP
  listFilterWidget.background:                  $SURFACE_RAISED
  listFilterWidget.outline:                     $ACCENT
  listFilterWidget.noMatchesOutline:            $ACCENT_DEEP
  listFilterWidget.shadow:                      !alpha [$SHADOW, '99']
  tree.indentGuidesStroke:                      $BORDER
  tree.inactiveIndentGuidesStroke:              $BORDER
  tree.tableColumnsBorder:                      $BORDER
  tree.tableOddRowsBackground:                  !alpha [$OVERLAY_LIGHT, '05']
  # Editor canvas
  editor.background:                            $SURFACE_EDITOR
  editor.foreground:                            $FG_EDITOR
  editorLineNumber.foreground:                  $FAINT
  editorLineNumber.activeForeground:            $MUTED
  editorLineNumber.dimmedForeground:            $FAINT
  editorCursor.foreground:                      $ACCENT_ACTIVE
  editorCursor.background:                      $SURFACE_SUNKEN
  editor.selectionBackground:                   $SELECTION
  editor.selectionForeground:                   $FG_MAX
  editor.inactiveSelectionBackground:           $SELECTION_SUBTLE
  editor.selectionHighlightBackground:          $SELECTION_SUBTLE
  editor.selectionHighlightBorder:              $TRANSPARENT
  editor.wordHighlightBackground:               !alpha [$FG_MUTED, '26']
  editor.wordHighlightStrongBackground:         !alpha [$FG_MUTED, '3d']
  editor.wordHighlightTextBackground:           !alpha [$FG_MUTED, '26']
  editor.wordHighlightBorder:                   $TRANSPARENT
  editor.wordHighlightStrongBorder:             $TRANSPARENT
  editor.wordHighlightTextBorder:               $TRANSPARENT
  editor.findMatchBackground:                   !alpha [$ACCENT, '4d']
  editor.findMatchBorder:                       $ACCENT
  editor.findMatchHighlightBackground:          !alpha [$ACCENT, '26']
  editor.findMatchHighlightBorder:              $TRANSPARENT
  editor.findRangeHighlightBackground:          !alpha [$FG_MUTED, '1a']
  editor.hoverHighlightBackground:              !alpha [$FG_MUTED, '21']
  editor.lineHighlightBackground:               !alpha [$OVERLAY_LIGHT, '08']
  editor.lineHighlightBorder:                   $TRANSPARENT
  editor.rangeHighlightBackground:              !alpha [$FG_MUTED, '1a']
  editor.symbolHighlightBackground:             !alpha [$ACCENT, '26']
  editorWhitespace.foreground:                  $BORDER
  editorIndentGuide.background1:                $BORDER
  editorIndentGuide.activeBackground1:          $FAINT
  # Inlay hints and rulers
  editorInlayHint.background:                   $SURFACE_RAISED
  editorInlayHint.foreground:                   $MUTED
  editorInlayHint.typeBackground:               $SURFACE_RAISED
  editorInlayHint.typeForeground:               $SYN_TYPE
  editorInlayHint.parameterBackground:          $SURFACE_RAISED
  editorInlayHint.parameterForeground:          $MUTED
  editorRuler.foreground:                       $BORDER
  editorCodeLens.foreground:                    $MUTED
  # Bracket pairs
  editorBracketMatch.background:                !alpha [$ACCENT, '1f']
  editorBracketMatch.border:                    $ACCENT_DEEP
  editorBracketHighlight.foreground1:           $ACCENT
  editorBracketHighlight.foreground2:           $ACCENT_BLUE
  editorBracketHighlight.foreground3:           $ACCENT_GREEN
  editorBracketHighlight.foreground4:           $ACCENT_YELLOW
  editorBracketHighlight.foreground5:           $ACCENT_TYPE
  editorBracketHighlight.foreground6:           $ACCENT_CYAN
  editorBracketHighlight.unexpectedBracket.foreground: $ACCENT_BRIGHT
  editorBracketPairGuide.background1:           !alpha [$ACCENT, '4d']
  editorBracketPairGuide.activeBackground1:     $ACCENT
  # Editor decorations and diagnostics
  editorLink.activeForeground:                  $ACCENT_BRIGHT
  editorUnnecessaryCode.opacity:                !alpha [$OVERLAY_DARK, '80']
  editorUnnecessaryCode.border:                 $TRANSPARENT
  editorLightBulb.foreground:                   $ACCENT_YELLOW
  editorLightBulbAutoFix.foreground:            $ACCENT_GREEN
  editorError.foreground:                       $ACCENT
  editorError.border:                           $TRANSPARENT
  editorWarning.foreground:                     $WARNING
  editorWarning.border:                         $TRANSPARENT
  editorInfo.foreground:                        $GIT_MODIFIED
  editorInfo.border:                            $TRANSPARENT
  editorHint.foreground:                        $MUTED
  editorHint.border:                            $TRANSPARENT
  problemsErrorIcon.foreground:                 $ACCENT
  problemsWarningIcon.foreground:               $WARNING
  problemsInfoIcon.foreground:                  $GIT_MODIFIED
  # Gutter and overview ruler
  editorGutter.background:                      $SURFACE_EDITOR
  editorGutter.modifiedBackground:              $WARNING
  editorGutter.addedBackground:                 $GIT_ADDED
  editorGutter.deletedBackground:               $ACCENT
  editorGutter.commentRangeForeground:          $FAINT
  editorGutter.foldingControlForeground:        $MUTED
  editorOverviewRuler.background:               $SURFACE_EDITOR
  editorOverviewRuler.border:                   $BORDER
  editorOverviewRuler.findMatchForeground:      !alpha [$ACCENT, '99']
  editorOverviewRuler.selectionHighlightForeground: !alpha [$FG_MUTED, '66']
  editorOverviewRuler.wordHighlightForeground:  !alpha [$FG_MUTED, '66']
  editorOverviewRuler.modifiedForeground:       $WARNING
  editorOverviewRuler.addedForeground:          $GIT_ADDED
  editorOverviewRuler.deletedForeground:        $ACCENT
  editorOverviewRuler.errorForeground:          $ACCENT
  editorOverviewRuler.warningForeground:        $WARNING
  editorOverviewRuler.infoForeground:           $GIT_MODIFIED
  editorOverviewRuler.bracketMatchForeground:   $ACCENT_DEEP
  # Widgets
  editorWidget.background:                      $SURFACE_PANEL
  editorWidget.foreground:                      $FG_SECONDARY
  editorWidget.border:                          $BORDER
  editorWidget.resizeBorder:                    $ACCENT
  editorSuggestWidget.background:               $SURFACE_PANEL
  editorSuggestWidget.border:                   $BORDER
  editorSuggestWidget.foreground:               $FG_SECONDARY
  editorSuggestWidget.focusHighlightForeground: $ACCENT_BRIGHT
  editorSuggestWidget.highlightForeground:      $ACCENT
  editorSuggestWidget.selectedBackground:       !alpha [$ACCENT, '29']
  editorSuggestWidget.selectedForeground:       $FG_BRIGHT
  editorSuggestWidget.selectedIconForeground:   $ACCENT
  editorSuggestWidgetStatus.foreground:         $MUTED
  editorHoverWidget.background:                 $SURFACE_PANEL
  editorHoverWidget.foreground:                 $FG_SECONDARY
  editorHoverWidget.border:                     $BORDER
  editorHoverWidget.highlightForeground:        $ACCENT
  editorHoverWidget.statusBarBackground:        $SURFACE_CHROME
  editorGhostText.foreground:                   $FAINT
  editorGhostText.border:                       $TRANSPARENT
  editorStickyScroll.background:                $SURFACE_PANEL
  editorStickyScrollHover.background:           $SURFACE_HOVER
  editorMarkerNavigation.background:            $SURFACE_PANEL
  editorMarkerNavigationError.background:       $ACCENT
  editorMarkerNavigationWarning.background:     $WARNING
  editorMarkerNavigationInfo.background:        $GIT_MODIFIED
  # Peek view
  peekView.border:                              $ACCENT
  peekViewEditor.background:                    $SURFACE_CHROME
  peekViewEditor.matchHighlightBackground:      !alpha [$ACCENT, '3d']
  peekViewEditorGutter.background:              $SURFACE_CHROME
  peekViewResult.background:                    $SURFACE_PANEL
  peekViewResult.fileForeground:                $FG_BRIGHT
  peekViewResult.lineForeground:                $FG_SECONDARY
  peekViewResult.matchHighlightBackground:      !alpha [$ACCENT, '3d']
  peekViewResult.selectionBackground:           !alpha [$ACCENT, '29']
  peekViewResult.selectionForeground:           $FG_BRIGHT
  peekViewTitle.background:                     $SURFACE_CHROME
  peekViewTitleLabel.foreground:                $FG_BRIGHT
  peekViewTitleDescription.foreground:          $MUTED
