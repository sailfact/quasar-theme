tokenColors:
  - name: "Comment"
    scope:
      - comment
      - punctuation.definition.comment
    settings:
      foreground: $TOK_COMMENT
      fontStyle: 'italic'
  - name: "Keyword"
    scope:
      - keyword
      - keyword.control
      - storage
      - storage.type
      - storage.modifier
      - keyword.other
    settings:
      foreground: $ACCENT
  - name: "Operator"
    scope:
      - keyword.operator
      - keyword.operator.assignment
      - keyword.operator.arithmetic
      - keyword.operator.logical
    settings:
      foreground: $FG_OPERATOR_ICON
  - name: "String"
    scope:
      - string
      - string.quoted
      - string.template
      - punctuation.definition.string
    settings:
      foreground: $ACCENT_STRING
  - name: "String interpolation"
    scope:
      - punctuation.definition.template-expression
      - meta.template.expression
    settings:
      foreground: $ACCENT
  - name: "Regex"
    scope:
      - string.regexp
      - constant.character.escape
    settings:
      foreground: $ACCENT_YELLOW
  - name: "Number / constant"
    scope:
      - constant.numeric
      - constant.language
      - constant.language.boolean
      - constant.language.null
      - constant.other
    settings:
      foreground: $ACCENT_YELLOW
  - name: "Function"
    scope:
      - entity.name.function
      - support.function
      - meta.function-call
      - meta.function-call.generic
      - variable.function
    settings:
      foreground: $ACCENT_FUNCTION
  - name: "Function declaration"
    scope:
      - entity.name.function.member
      - meta.definition.method entity.name.function
    settings:
      foreground: $ACCENT_FUNCTION
  - name: "Type / class"
    scope:
      - entity.name.type
      - entity.name.class
      - entity.name.namespace
      - entity.other.inherited-class
      - support.type
      - support.class
      - entity.name.type.interface
    settings:
      foreground: $ACCENT_TYPE
  - name: "Type parameter"
    scope:
      - entity.name.type.parameter
      - support.type.primitive
    settings:
      foreground: $ACCENT_TYPE
      fontStyle: 'italic'
  - name: "Variable"
    scope:
      - variable
      - variable.other
      - variable.other.readwrite
      - meta.definition.variable
    settings:
      foreground: $FG_VARIABLE
  - name: "Parameter"
    scope:
      - variable.parameter
      - meta.parameter
    settings:
      foreground: $FG_VARIABLE
      fontStyle: 'italic'
  - name: "Property"
    scope:
      - variable.other.property
      - support.type.property-name
      - meta.object-literal.key
      - variable.other.object.property
    settings:
      foreground: $ACCENT_FUNCTION
  - name: "This / self"
    scope:
      - variable.language
      - variable.language.this
      - variable.language.self
    settings:
      foreground: $ACCENT
      fontStyle: 'italic'
  - name: "Constant variable"
    scope:
      - variable.other.constant
      - entity.name.constant
    settings:
      foreground: $ACCENT_YELLOW
  - name: "Punctuation"
    scope:
      - punctuation
      - meta.brace
      - punctuation.separator
      - punctuation.terminator
      - punctuation.accessor
    settings:
      foreground: $FG_MUTED
  - name: "Decorator"
    scope:
      - meta.decorator
      - entity.name.function.decorator
      - punctuation.decorator
    settings:
      foreground: $ACCENT_TYPE
  - name: "HTML / JSX tag"
    scope:
      - entity.name.tag
      - support.class.component
    settings:
      foreground: $ACCENT
  - name: "Attribute"
    scope:
      - entity.other.attribute-name
      - entity.other.attribute-name.html
    settings:
      foreground: $ACCENT_TYPE
      fontStyle: 'italic'
  - name: "CSS selector"
    scope:
      - entity.other.attribute-name.class.css
      - entity.other.attribute-name.id.css
      - entity.name.tag.css
    settings:
      foreground: $ACCENT
  - name: "CSS property"
    scope:
      - support.type.property-name.css
      - meta.property-name.css
    settings:
      foreground: $ACCENT_FUNCTION
  - name: "CSS value"
    scope:
      - support.constant.property-value.css
      - constant.numeric.css
      - keyword.other.unit.css
    settings:
      foreground: $ACCENT_YELLOW
  - name: "JSON key"
    scope:
      - support.type.property-name.json
    settings:
      foreground: $ACCENT_FUNCTION
  - name: "YAML key"
    scope:
      - entity.name.tag.yaml
    settings:
      foreground: $ACCENT_FUNCTION
  - name: "Shell built-in"
    scope:
      - support.function.builtin.shell
      - entity.name.function.shell
    settings:
      foreground: $ACCENT_FUNCTION
  - name: "Shell variable"
    scope:
      - variable.other.normal.shell
      - punctuation.definition.variable.shell
    settings:
      foreground: $FG_VARIABLE
  - name: "Markdown heading"
    scope:
      - markup.heading
      - entity.name.section.markdown
      - punctuation.definition.heading.markdown
    settings:
      foreground: $ACCENT
      fontStyle: 'bold'
  - name: "Markdown bold"
    scope:
      - markup.bold
    settings:
      foreground: $FG
      fontStyle: 'bold'
  - name: "Markdown italic"
    scope:
      - markup.italic
    settings:
      foreground: $FG
      fontStyle: 'italic'
  - name: "Markdown link"
    scope:
      - markup.underline.link
      - string.other.link.title.markdown
    settings:
      foreground: $ACCENT_BRIGHT
  - name: "Markdown code"
    scope:
      - markup.inline.raw
      - markup.fenced_code
      - fenced_code.block.language
    settings:
      foreground: $ACCENT_STRING
  - name: "Markdown quote"
    scope:
      - markup.quote
    settings:
      foreground: $FG_MUTED
      fontStyle: 'italic'
  - name: "Markdown list"
    scope:
      - punctuation.definition.list.begin.markdown
      - beginning.punctuation.definition.list
    settings:
      foreground: $ACCENT
  - name: "Diff inserted"
    scope:
      - markup.inserted
    settings:
      foreground: $ACCENT_GREEN
  - name: "Diff deleted"
    scope:
      - markup.deleted
    settings:
      foreground: $ACCENT
  - name: "Diff changed"
    scope:
      - markup.changed
    settings:
      foreground: $ACCENT_YELLOW
  - name: "Deprecated"
    scope:
      - entity.name.function.deprecated
      - invalid.deprecated
    settings:
      foreground: $FG_MUTED
      fontStyle: 'strikethrough'
  - name: "Invalid"
    scope:
      - invalid
      - invalid.illegal
    settings:
      foreground: $ACCENT_BRIGHT
  - name: "Preprocessor"
    scope:
      - meta.preprocessor
      - keyword.control.directive
    settings:
      foreground: $ACCENT_TYPE
  - name: "Import / from"
    scope:
      - keyword.control.import
      - keyword.control.from
      - keyword.control.export
    settings:
      foreground: $ACCENT
  - name: "Escape"
    scope:
      - constant.character.escape
      - constant.other.placeholder
    settings:
      foreground: $ACCENT_YELLOW

semanticTokenColors:
  namespace: $ACCENT_TYPE
  class: $ACCENT_TYPE
  interface: $ACCENT_TYPE
  enum: $ACCENT_TYPE
  struct: $ACCENT_TYPE
  typeParameter:
    foreground: $ACCENT_TYPE
    fontStyle: 'italic'
  type: $ACCENT_TYPE
  function: $ACCENT_FUNCTION
  method: $ACCENT_FUNCTION
  property: $ACCENT_FUNCTION
  parameter:
    foreground: $FG_VARIABLE
    fontStyle: 'italic'
  variable: $FG_VARIABLE
  variable.readonly: $ACCENT_YELLOW
  enumMember: $ACCENT_YELLOW
  keyword: $ACCENT
  operator: $FG_OPERATOR_ICON
  string: $ACCENT_STRING
  number: $ACCENT_YELLOW
  comment:
    foreground: $TOK_COMMENT
    fontStyle: 'italic'
  decorator: $ACCENT_TYPE
  event: $ACCENT_YELLOW
  label: $FG_MUTED
  macro: $ACCENT_TYPE
  "*.declaration":
    fontStyle: ''
  "*.deprecated":
    fontStyle: 'strikethrough'
  "*.abstract":
    fontStyle: 'italic'
