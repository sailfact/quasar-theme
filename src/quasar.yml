$schema: vscode://schemas/color-theme
name: Quasar
semanticHighlighting: true
quasar:
  base:
    - &BG           '#1e2436'
    - &FG           '#e8e8f0'
    - &FG_DIM       '#a5b1cc'
    - &RED          '#f080a0'
    - &PINK         '#f4a0b8'
    - &ORANGE       '#d4a259'
    - &YELLOW       '#e0b478'
    - &GREEN        '#74b39a'
    - &GREEN_BRIGHT '#8fc7b0'
    - &BLUE         '#6090c8'
    - &BLUE_BRIGHT  '#84acdc'
    - &PURPLE       '#c98ba0'
    - &PURPLE_DARK  '#a86d7e'
    - &CYAN         '#8cc5cc'
    - &CYAN_DARK    '#6aa8b0'
    - &COMMENT      '#6a789c'
    - &DESC_FG      '#8090b0'
    - &DISABLED     '#4a5470'
    - &BORDER       '#303850'
    - &FUNC_FG      '#a4c4ec'
    - &VAR_FG       '#d8dcea'
    - &STR_FG       '#a8cfbe'
  ui:
    - &BG_LIGHTER   '#283048'
    - &BG_LIGHT     '#232b40'
    - &BG_DARK      '#1a1a24'
    - &BG_DARKER    '#0e0e14'
    - &SELECTION    '#f080a033'
    - &WHITE        '#f8f8f8'
    - &WHITE_DIM    '#c6cee0'
  ansi:
    - &COLOR0       *BG_DARKER
    - &COLOR1       *RED
    - &COLOR2       *GREEN
    - &COLOR3       *ORANGE
    - &COLOR4       *BLUE
    - &COLOR5       *PURPLE_DARK
    - &COLOR6       *CYAN_DARK
    - &COLOR7       *WHITE_DIM
    - &COLOR8       '#3a4460'
    - &COLOR9       *PINK
    - &COLOR10      *GREEN_BRIGHT
    - &COLOR11      *YELLOW
    - &COLOR12      *BLUE_BRIGHT
    - &COLOR13      *PURPLE
    - &COLOR14      *CYAN
    - &COLOR15      *WHITE

colors:
  foreground: *FG_DIM
  errorForeground: *RED
  descriptionForeground: *DESC_FG
  disabledForeground: *DISABLED
  focusBorder: *RED
  widget.border: *BORDER
  widget.shadow: '#08080e99'
  selection.background: *SELECTION
  icon.foreground: *FG_DIM
  sash.hoverBorder: *RED
  contrastBorder: *BORDER
  contrastActiveBorder: *RED

  # Toolbar & TitleBar
  toolbar.hoverBackground: *BORDER
  toolbar.activeBackground: *BORDER
  titleBar.activeBackground: *BG_DARK
  titleBar.activeForeground: *FG_DIM
  titleBar.inactiveBackground: *BG_DARK
  titleBar.inactiveForeground: *DESC_FG
  titleBar.border: *BORDER

  # Window & Menu
  window.activeBorder: *BORDER
  window.inactiveBorder: *BORDER
  menubar.selectionForeground: '#f0f0f8'
  menubar.selectionBackground: *BORDER
  menubar.selectionBorder: '#00000000'
  menu.background: *BG_LIGHT
  menu.foreground: *FG_DIM
  menu.border: *BORDER
  menu.selectionForeground: '#f0f0f8'
  menu.selectionBackground: '#f080a029'
  menu.selectionBorder: '#00000000'
  menu.separatorBackground: *BORDER

  # Quick Input
  quickInput.background: *BG_LIGHT
  quickInput.foreground: *FG_DIM
  quickInputTitle.background: *BG_DARK
  quickInputList.focusBackground: '#f080a029'
  quickInputList.focusForeground: '#f0f0f8'
  quickInputList.focusIconForeground: *RED
  pickerGroup.foreground: *DESC_FG
  pickerGroup.border: *BORDER

  # Keybinding
  keybindingLabel.background: *BG_LIGHTER
  keybindingLabel.foreground: *WHITE_DIM
  keybindingLabel.border: *BORDER
  keybindingLabel.bottomBorder: *DISABLED
  keybindingTable.headerBackground: *BG_LIGHTER
  keybindingTable.rowsBackground: *BG_LIGHT

  # Command Center
  commandCenter.background: *BG_LIGHTER
  commandCenter.foreground: *FG_DIM
  commandCenter.border: *BORDER
  commandCenter.activeBackground: *BORDER
  commandCenter.activeForeground: '#f0f0f8'
  commandCenter.activeBorder: *RED
  commandCenter.inactiveForeground: *DESC_FG
  commandCenter.inactiveBorder: *BORDER

  # Activity Bar
  activityBar.background: *BG_DARK
  activityBar.foreground: '#f0f0f8'
  activityBar.inactiveForeground: *DESC_FG
  activityBar.border: *BORDER
  activityBar.activeBorder: *RED
  activityBar.activeBackground: *BG_LIGHT
  activityBar.activeFocusBorder: *RED
  activityBarBadge.background: *RED
  activityBarBadge.foreground: '#14141c'
  activityBarTop.foreground: '#f0f0f8'
  activityBarTop.inactiveForeground: *DESC_FG
  activityBarTop.activeBorder: *RED

  # Side Bar
  sideBar.background: *BG_LIGHT
  sideBar.foreground: *FG_DIM
  sideBar.border: *BORDER
  sideBar.dropBackground: '#f080a01f'
  sideBarTitle.foreground: *DESC_FG
  sideBarTitle.background: *BG_LIGHT
  sideBarSectionHeader.background: *BG_LIGHT
  sideBarSectionHeader.foreground: *DESC_FG
  sideBarSectionHeader.border: *BORDER
  sideBarActivityBarTop.border: *BORDER

  # Lists and Trees
  list.activeSelectionBackground: '#f080a029'
  list.activeSelectionForeground: '#f0f0f8'
  list.activeSelectionIconForeground: *RED
  list.inactiveSelectionBackground: *BG_LIGHTER
  list.inactiveSelectionForeground: *WHITE_DIM
  list.hoverBackground: *BORDER
  list.hoverForeground: '#f0f0f8'
  list.focusBackground: '#f080a01f'
  list.focusForeground: '#f0f0f8'
  list.focusOutline: *RED
  list.inactiveFocusBackground: *BG_LIGHTER
  list.inactiveFocusOutline: *BORDER
  list.dropBackground: '#f080a01f'
  list.highlightForeground: *RED
  list.focusHighlightForeground: *PINK
  list.errorForeground: *RED
  list.warningForeground: *ORANGE
  list.invalidItemForeground: *DISABLED
  list.filterMatchBackground: *SELECTION
  list.filterMatchBorder: '#b8506e'
  listFilterWidget.background: *BG_LIGHTER
  listFilterWidget.outline: *RED
  listFilterWidget.noMatchesOutline: '#b8506e'
  listFilterWidget.shadow: '#08080e99'
  tree.indentGuidesStroke: *BORDER
  tree.inactiveIndentGuidesStroke: *BORDER
  tree.tableColumnsBorder: *BORDER
  tree.tableOddRowsBackground: '#ffffff05'

  # Editor
  editor.background: *BG
  editor.foreground: *FG
  editorLineNumber.foreground: *DISABLED
  editorLineNumber.activeForeground: *DESC_FG
  editorLineNumber.dimmedForeground: *DISABLED
  editorCursor.foreground: *RED
  editorCursor.background: *BG_DARKER
  editor.selectionBackground: *SELECTION
  editor.selectionForeground: *WHITE
  editor.inactiveSelectionBackground: '#f080a01a'
  editor.selectionHighlightBackground: '#f080a01a'
  editor.selectionHighlightBorder: '#00000000'
  editor.wordHighlightBackground: '#8090b026'
  editor.wordHighlightStrongBackground: '#8090b03d'
  editor.wordHighlightTextBackground: '#8090b026'
  editor.findMatchBackground: '#f080a04d'
  editor.findMatchBorder: *RED
  editor.findMatchHighlightBackground: '#f080a026'
  editor.findMatchHighlightBorder: '#00000000'
  editor.findRangeHighlightBackground: '#8090b01a'
  editor.hoverHighlightBackground: '#8090b021'
  editor.lineHighlightBackground: '#ffffff08'
  editor.lineHighlightBorder: '#00000000'
  editor.rangeHighlightBackground: '#8090b01a'
  editor.symbolHighlightBackground: '#f080a026'
  editorWhitespace.foreground: *BORDER
  editorIndentGuide.background1: *BORDER
  editorIndentGuide.activeBackground1: *DISABLED
  editorInlayHint.background: *BG_LIGHTER
  editorInlayHint.foreground: *DESC_FG
  editorInlayHint.typeBackground: *BG_LIGHTER
  editorInlayHint.typeForeground: *PURPLE
  editorInlayHint.parameterBackground: *BG_LIGHTER
  editorInlayHint.parameterForeground: *DESC_FG
  editorRuler.foreground: *BORDER
  editorCodeLens.foreground: *DESC_FG

  # Bracket Matches
  editorBracketMatch.background: '#f080a01f'
  editorBracketMatch.border: '#b8506e'
  editorBracketHighlight.foreground1: *RED
  editorBracketHighlight.foreground2: *BLUE_BRIGHT
  editorBracketHighlight.foreground3: *GREEN_BRIGHT
  editorBracketHighlight.foreground4: *YELLOW
  editorBracketHighlight.foreground5: *PURPLE
  editorBracketHighlight.foreground6: *CYAN
  editorBracketHighlight.unexpectedBracket.foreground: *PINK
  editorBracketPairGuide.background1: '#f080a04d'
  editorBracketPairGuide.activeBackground1: *RED

  # Editor Status / Notifications
  editorLink.activeForeground: *PINK
  editorUnnecessaryCode.opacity: '#00000080'
  editorUnnecessaryCode.border: '#00000000'
  editorLightBulb.foreground: *YELLOW
  editorLightBulbAutoFix.foreground: *GREEN_BRIGHT
  editorError.foreground: *RED
  editorError.border: '#00000000'
  editorWarning.foreground: *ORANGE
  editorWarning.border: '#00000000'
  editorInfo.foreground: *BLUE
  editorInfo.border: '#00000000'
  editorHint.foreground: *DESC_FG
  editorHint.border: '#00000000'

  # Terminal
  terminal.background: *BG_DARKER
  terminal.foreground: *FG
  terminal.border: *BORDER
  terminal.selectionBackground: '#f080a040'
  terminal.inactiveSelectionBackground: '#f080a020'
  terminal.selectionForeground: '#00000000'
  terminal.hoverHighlightBackground: '#8090b026'
  terminal.dropBackground: '#f080a01f'
  terminal.tab.activeBorder: *RED
  terminal.findMatchBackground: '#f080a04d'
  terminal.findMatchBorder: *RED
  terminal.findMatchHighlightBackground: '#f080a026'
  terminal.findMatchHighlightBorder: '#00000000'
  terminalCursor.foreground: *RED
  terminalCursor.background: *BG_DARKER
  terminal.ansiBlack: *COLOR0
  terminal.ansiBrightBlack: *COLOR8
  terminal.ansiRed: *COLOR1
  terminal.ansiBrightRed: *COLOR9
  terminal.ansiGreen: *COLOR2
  terminal.ansiBrightGreen: *COLOR10
  terminal.ansiYellow: *COLOR3
  terminal.ansiBrightYellow: *COLOR11
  terminal.ansiBlue: *COLOR4
  terminal.ansiBrightBlue: *COLOR12
  terminal.ansiMagenta: *COLOR5
  terminal.ansiBrightMagenta: *COLOR13
  terminal.ansiCyan: *COLOR6
  terminal.ansiBrightCyan: *COLOR14
  terminal.ansiWhite: *COLOR7
  terminal.ansiBrightWhite: *COLOR15

tokenColors:
  - name: Comment
    scope:
      - comment
      - punctuation.definition.comment
    settings:
      foreground: *COMMENT
      fontStyle: italic

  - name: Keyword
    scope:
      - keyword
      - keyword.control
      - storage
      - storage.type
      - storage.modifier
      - keyword.other
    settings:
      foreground: *RED

  - name: Operator
    scope:
      - keyword.operator
      - keyword.operator.assignment
      - keyword.operator.arithmetic
      - keyword.operator.logical
    settings:
      foreground: *FG_DIM

  - name: String
    scope:
      - string
      - string.quoted
      - string.template
      - punctuation.definition.string
    settings:
      foreground: *STR_FG

  - name: String interpolation
    scope:
      - punctuation.definition.template-expression
      - meta.template.expression
    settings:
      foreground: *RED

  - name: Regex
    scope:
      - string.regexp
      - constant.character.escape
    settings:
      foreground: *YELLOW

  - name: Number / constant
    scope:
      - constant.numeric
      - constant.language
      - constant.language.boolean
      - constant.language.null
      - constant.other
    settings:
      foreground: *YELLOW

  - name: Function
    scope:
      - entity.name.function
      - support.function
      - meta.function-call
      - meta.function-call.generic
      - variable.function
    settings:
      foreground: *FUNC_FG

  - name: Function declaration
    scope:
      - entity.name.function.member
      - meta.definition.method entity.name.function
    settings:
      foreground: *FUNC_FG

  - name: Type / class
    scope:
      - entity.name.type
      - entity.name.class
      - entity.name.namespace
      - entity.other.inherited-class
      - support.type
      - support.class
      - entity.name.type.interface
    settings:
      foreground: *PURPLE

  - name: Type parameter
    scope:
      - entity.name.type.parameter
      - support.type.primitive
    settings:
      foreground: *PURPLE
      fontStyle: italic

  - name: Variable
    scope:
      - variable
      - variable.other
      - variable.other.readwrite
      - meta.definition.variable
    settings:
      foreground: *VAR_FG

  - name: Parameter
    scope:
      - variable.parameter
      - meta.parameter
    settings:
      foreground: *VAR_FG
      fontStyle: italic

  - name: Property
    scope:
      - variable.other.property
      - support.type.property-name
      - meta.object-literal.key
      - variable.other.object.property
    settings:
      foreground: *FUNC_FG

  - name: This / self
    scope:
      - variable.language
      - variable.language.this
      - variable.language.self
    settings:
      foreground: *RED
      fontStyle: italic

  - name: Constant variable
    scope:
      - variable.other.constant
      - entity.name.constant
    settings:
      foreground: *YELLOW

  - name: Punctuation
    scope:
      - punctuation
      - meta.brace
      - punctuation.separator
      - punctuation.terminator
      - punctuation.accessor
    settings:
      foreground: *DESC_FG

  - name: Decorator
    scope:
      - meta.decorator
      - entity.name.function.decorator
      - punctuation.decorator
    settings:
      foreground: *PURPLE

  - name: HTML / JSX tag
    scope:
      - entity.name.tag
      - support.class.component
    settings:
      foreground: *RED

  - name: Attribute
    scope:
      - entity.other.attribute-name
      - entity.other.attribute-name.html
    settings:
      foreground: *PURPLE
      fontStyle: italic

  - name: CSS selector
    scope:
      - entity.other.attribute-name.class.css
      - entity.other.attribute-name.id.css
      - entity.name.tag.css
    settings:
      foreground: *RED

  - name: CSS property
    scope:
      - support.type.property-name.css
      - meta.property-name.css
    settings:
      foreground: *FUNC_FG

  - name: Markdown heading
    scope:
      - markup.heading
      - entity.name.section.markdown
      - punctuation.definition.heading.markdown
    settings:
      foreground: *RED
      fontStyle: bold

  - name: Markdown code
    scope:
      - markup.inline.raw
      - markup.fenced_code
      - fenced_code.block.language
    settings:
      foreground: *STR_FG

  - name: Diff inserted
    scope:
      - markup.inserted
    settings:
      foreground: *GREEN_BRIGHT

  - name: Diff deleted
    scope:
      - markup.deleted
    settings:
      foreground: *RED

  - name: Invalid
    scope:
      - invalid
      - invalid.illegal
    settings:
      foreground: *PINK

semanticTokenColors:
  namespace: *PURPLE
  class: *PURPLE
  interface: *PURPLE
  enum: *PURPLE
  struct: *PURPLE
  typeParameter:
    foreground: *PURPLE
    fontStyle: italic
  type: *PURPLE
  function: *FUNC_FG
  method: *FUNC_FG
  property: *FUNC_FG
  parameter:
    foreground: *VAR_FG
    fontStyle: italic
  variable: *VAR_FG
  variable.readonly: *YELLOW
  enumMember: *YELLOW
  keyword: *RED
  operator: *FG_DIM
  string: *STR_FG
  number: *YELLOW
  comment:
    foreground: *COMMENT
    fontStyle: italic
  decorator: *PURPLE
  event: *YELLOW
  label: *DESC_FG
  macro: *PURPLE
  "*.declaration":
    fontStyle: ""
  "*.deprecated":
    fontStyle: strikethrough
  "*.abstract":
    fontStyle: italic
